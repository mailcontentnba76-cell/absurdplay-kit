  tfx.push({type:'cloth',x,y:1.45,z,k:u/1.0,seed:i*7+1,colors:team.cloth,ry,n:10,s:0.55});
  tfx.push({type:'smoke',x,y:1.0,z,k:(u-0.36)/0.8,seed:i*3,colors:team.smoke,s:1.0});};
const flee=(i,t,t0)=>{const ch=PL[i];const sp=i<5;const x1=XS(i),z=ZL[i%5];const sz=Math.sign(z);const u=t-t0;
  if(u<0.25){idle(ch,x1,z,sp?PI/2:-PI/2,t,i,{crouch:0.2});E(ch,t,[[0,'shock']],60+i);ch.root.position.x+=(sp?-1:1)*sm(u/0.25)*0.35;}
  else{const w=Math.max(0,u-0.25);const dx=(sp?-1:1)*1.5*w,dz=sz*5.2*w;sprint(ch,x1+(sp?-1:1)*0.35+dx,z+dz,Math.atan2(sz*5.2,(sp?-1:1)*1.5),Math.hypot(dx,dz)/2.9+i*0.13);E(ch,t,[[0,'shock']],60+i);}};

const camSet=(p,l,fov=46)=>{cam.position.set(...p);cam.lookAt(...l);cam.fov=fov;cam.updateProjectionMatrix();};
const hookPose=(t)=>{hideAll();P.crowd.uT.value=t;P.crowd.uCheer.value=t<T_ARR?0.7:1;P.crowd.uBoo.value=0;P.center.draw({a:0,b:0,clock:'12:00'});
  const tfx=[];const tm=t-TOFF;const TR=TOFF+0.35;
  if(t<TOFF+SH.s1[0]+0.001&&t<TR-0.62){for(let i=0;i<10;i++)runIn(i,t);}
  else if(tm<SH.s2[0]){for(let i=0;i<10;i++){if(i===0||i===5)continue;idle(PL[i],XS(i),ZL[i%5],i<5?PI/2:-PI/2,t,i,{crouch:0.3});E(PL[i],t,[[0,tm>0.3?'shock':'determined']],60+i);}
    rip(0,0,CO,t,TR,TEAM_S,tfx);rip(5,1,BE,t,TR+0.06,TEAM_H,tfx);}
  else{rip(0,0,CO,t,TR,TEAM_S,tfx);rip(5,1,BE,t,TR+0.06,TEAM_H,tfx);for(let i=0;i<10;i++){if(i===0||i===5)continue;flee(i,t,TOFF+SH.s2[0]-0.05+(i%5)*0.04);}}
  TFX.draw(tfx);
  // máy quay
  if(t<HK.h2)camSet([-16.2+t*2.4,1.6,0.9],[-3+t*2.4,0.9,0],52);                       // sau lưng hàng Spurs, bám theo
  else if(t<HK.h3){const u=t-HK.h2;camSet([0.4,4.2-u*0.6,11.5-u*1.2],[0,1.2,0],58);}     // toàn cảnh 2 hàng lao vào nhau
  else if(tm<0){const u=t-HK.h3;camSet([0.1,1.6,5.2-u*0.2],[0,1.55,0],44);}               // cận mặt Wemby–Sengun
  else if(tm<SH.s2[0]){const u=tm;camSet([0.1,1.6,5.0+u*0.3],[0,1.4,0],50);}             // xé áo
  else{const u=tm-SH.s2[0];camSet([0.2,1.5,5.8+u*0.6],[0,1.0,0],54);}                    // sói & gấu hiện ra, đồng đội bỏ chạy
  if(Math.abs(t-T_ARR)<0.12){const k=1-Math.abs(t-T_ARR)/0.12;cam.position.y+=Math.sin(t*90)*0.03*k;}
  const cp=cam.position;L.area(0,0,cp);};
const pose=t=>{const tm=t-TOFF;if(tm<SH.s2[1])hookPose(t);else poseMain(tm);};
function show(...a){a.forEach(o=>o.visible=true);}
let comp;if(MB){comp=new EffectComposer(r,{frameBufferType:THREE.HalfFloatType,multisampling:2});comp.addPass(new RenderPass(s,cam));
 const vp=new VelocityDepthNormalPass(s,cam);comp.addPass(vp);comp.addPass(new EffectPass(cam,new MotionBlurEffect(vp,{intensity:0.5,jitter:0,samples:8}),new ToneMappingEffect({mode:ToneMappingMode.NEUTRAL})));}
const GCUTS=[0,HK.h2,HK.h3,TOFF,...CUTS.filter(c=>c>0).map(c=>c+TOFF)];window.CUTS=GCUTS;
window.renderFrame=t=>{if(!MB){pose(t);r.render(s,cam);return;}
  const dt=1/30;let c0=0;for(const c of GCUTS)if(c<=t+1e-6)c0=c;const tp=Math.max(c0,t-dt);if(!(window._lt!=null&&Math.abs(window._lt-tp)<1e-4&&tp>c0-1e-6&&tp!==t)){pose(tp);comp.render(dt);}pose(t);comp.render(dt);window._lt=t;};
window.ready=true;
</script></body></html>
