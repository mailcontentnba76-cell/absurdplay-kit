 const vp=new VelocityDepthNormalPass(s,cam);{const _set=vp.setVelocityDepthNormalMaterialInScene.bind(vp),_un=vp.unsetVelocityDepthNormalMaterialInScene.bind(vp);const IMs=Object.values(PR.crowd.IM);let vis=[];vp.setVelocityDepthNormalMaterialInScene=()=>{vis=IMs.map(m=>m.visible);IMs.forEach(m=>m.visible=false);_set();};vp.unsetVelocityDepthNormalMaterialInScene=()=>{_un();IMs.forEach((m,i)=>m.visible=vis[i]);};}comp.addPass(vp);comp.addPass(new EffectPass(cam,new MotionBlurEffect(vp,{intensity:0.5,jitter:0,samples:8}),new ToneMappingEffect({mode:ToneMappingMode.NEUTRAL})));}
window.CUTS=CUTS;
const poseG=t=>{pose(t);snapGround(ALL.map(c=>c.root));};
window.renderFrame=t=>{if(!MB){poseG(t);r.render(s,cam);return;}
  const dt=1/30;let c0=0;for(const c of CUTS)if(c<=t+1e-6)c0=c;const tp=Math.max(c0,t-dt);if(!(window._lt!=null&&Math.abs(window._lt-tp)<1e-4&&tp>c0-1e-6&&tp!==t)){poseG(tp);comp.render(dt);}poseG(t);comp.render(dt);window._lt=t;};
const BITE_P=(()=>{const q=JG[0];cat(q,0,0,PI/2,21.9,{crouch:0.25,look:[0,-0.25],wide:0.3});const hp=headPos(q,0.42,-0.18);const bx=hp.x+0.55;return {x:bx,z:0,pad:new THREE.Vector3(hp.x-bx,hp.y,hp.z)};})();
const SHELL_P=(()=>{const q=JG[0];cat(q,0,-0.2,-PI/2,23.7,{crouch:0.2,look:[0,-0.6]});const hp=headPos(q,0.42,-0.25);return new THREE.Vector3(hp.x,0,hp.z+0.12);})();
const GROUNDED=()=>[...ALL.map(c=>c.root),...CATS.map(q=>q.root),CART,BENCH,SHELL];
window.dbgBite=t=>{poseG(t);let r=[];BITE.traverse(o=>{if(o.isGroup&&o!==BITE)r.push(+o.rotation.z.toFixed(2));});return [BITE.visible,r];};
window.prof=t=>{const a=performance.now();poseG(t);const b=performance.now();comp.render(1/30);const c=performance.now();r.getContext().finish();const d=performance.now();return [+(b-a).toFixed(0),+(c-b).toFixed(0),+(d-c).toFixed(0)];};
window.qaFloat=t=>{poseG(t);return [...ALL.map(c=>c.root),...CATS.map(q=>q.root)].filter(o=>o.visible).map(o=>[o.name||'ng',+minY(o,1e6).toFixed(3)]).filter(a=>a[1]>0.008&&a[1]<0.12);};
window.qaGround=t=>{poseG(t);return checkGround(GROUNDED());};
window.lowBone=t=>{pose(t);const out=[];const v=new THREE.Vector3();for(const q of CATS){if(!q.root.visible)continue;let m=1e9,bi=-1;q.root.traverse(o=>{if(!o.isSkinnedMesh)return;const sk=o.geometry.attributes.skinIndex,sw=o.geometry.attributes.skinWeight;for(let i=0;i<o.geometry.attributes.position.count;i+=3){o.getVertexPosition(i,v);v.applyMatrix4(o.matrixWorld);if(v.y<m){m=v.y;let best=0;for(let k=1;k<4;k++)if(sw.getComponent(i,k)>sw.getComponent(i,best))best=k;bi=o.skeleton.bones[sk.getComponent(i,best)].name;}}});out.push([q.kind,+m.toFixed(3),bi]);}return out;};
window.ready=true;
