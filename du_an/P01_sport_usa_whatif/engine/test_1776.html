<script type="module">
// Ảnh kiểm E24: 5 dân 1776 + hươu + chuông + cuộn giấy. t: 0 = toàn cảnh, 1 = cận mặt, 2 = sau lưng

window.renderFrame=t=>{const k=Math.floor(t);
  P.forEach((ch,i)=>{ch.root.position.set(-2.4+i*1.0,0,0);ch.root.rotation.set(0,i===4?Math.PI:0.1*(i-2),0);resetPose(ch);clipPose(ch,lib,[{name:'Idle_Loop',time:t+i,w:1}]);ch.root.updateMatrixWorld(true);expr(ch,t,[[0,['smug','neutral','determined','surprised','laugh'][i]]],{seed:i});});

  cam.position.set(...V[0]);cam.lookAt(...V[1]);r.render(s,cam);};

</script></body></html>
