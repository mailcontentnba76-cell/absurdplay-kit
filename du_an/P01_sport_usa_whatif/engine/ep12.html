const pAt=(p,x,z,t,o={},ry=-Math.PI/2)=>{p.root.position.set(x,o.y||0,z);p.root.rotation.set(0,ry,0);p.update(t,o);p.root.visible=true;p.root.updateMatrixWorld(true);return p;};
const planes=(t,pos=GD,c=()=>({}))=>pos.forEach(([x,z],i)=>{const o=c(i);if(o.skip)return;pAt(PL[i],x,z,t,o,o.ry??-Math.PI/2);});
// bay theo cung: mũi máy bay hướng theo vận tốc
const fly=(p,p0,p1,k,h,t,o={})=>{const a=arc(p0,p1,k,h),b=arc(p0,p1,Math.min(1,k+0.01),h);p.root.position.copy(a);p.root.position.y-=0.5*PS;const d=b.clone().sub(a);
  p.root.rotation.set(0,Math.atan2(d.x,d.z),0);p.update(t,{pitch:Math.atan2(d.y,Math.hypot(d.x,d.z))*0.8,bank:o.bank??Math.sin(k*6)*0.25,flap:0.12,...o});p.root.visible=true;p.root.updateMatrixWorld(true);};
const offense=(t,los=LOS,skip=-1)=>OL.forEach((ch,i)=>{if(i===skip)return;idle(ch,los-0.9,-2.4+i*1.2,Math.PI/2,t,i*1.3,{crouch:0.75});show(ch);});
const qbShot=(t,x=QX)=>{idle(QB,x,0,Math.PI/2,t,1,{crouch:0.3});const hp=holdBall(QB,t);show(QB);return hp;};
const kickAt=(ch,x,z,ry,u)=>{place(ch,x,z,ry);CLIP(ch,'MX_Field_Goal',Math.min(1.29,Math.max(0,0.42-0.6+u)),{loop:false});show(ch);};
const fgShot=(t,t0)=>{const u=t-t0;kickAt(KJ,KX-0.6,0,Math.PI/2,u);E(KJ,t,[[0,'determined']],3);const tk=u-0.6;if(tk<0)bball(V(KX,0.15,0),0);else{const q=cl(tk/1.3);bball(arc(V(KX,0.2,0),V(PX+5,6.5,0),q,4),q*18);}};
const pose=t=>{
  rig.apply(t);hideAll();A.update(t,{cheer:(IN('s9',t)||IN('s18',t)||IN('s24',t))?0.9:0.3,boo:IN('s3',t)||IN('s14',t)||IN('s16',t)||IN('s23',t)?0.5:0});LT.follow(cam);
  const sc=t<SH.s10[0]?{home:0,away:0,q:1,clock:'15:00'}:t<SH.s14[0]+0.5?{home:0,away:0,q:1,clock:'14:51'}:t<SH.s16[0]+0.5?{home:3,away:0,q:2,clock:'8:12'}:t<SH.s18[0]+0.3?{home:6,away:0,q:3,clock:'4:40'}:t<SH.s21[0]?{home:6,away:7,q:3,clock:'1:02'}:t<SH.s24[0]?{home:12,away:14,q:4,clock:'0:09'}:{home:12,away:14,q:4,clock:'0:00'};A.board.set(sc);
  // s1–s1b (HOOK): Jets lao vào hàng máy bay giấy — máy bay không nhúc nhích, cầu thủ bật ngược ngã mềm
  if(IN('s1',t)){bball(qbShot(t));E(QB,t,[[0,'determined'],[0.8,'surprised']],1);
    OL.forEach((ch,i)=>{const h=HOOK[i],t0=-0.4+h.d;if(t<h.tc){locoLock(ch,lib,t,(tt)=>[h.x0+6.1*Math.max(0,tt-t0),h.z],{t0,gait:'MX_Sprint',face:Math.PI/2});show(ch);E(ch,t,[[0,'determined']],i+2);}
      else{const k=sm((t-h.tc)/0.4);const cx=h.x0+6.1*(h.tc-t0);softFall(ch,cx-k*1.1,h.z,Math.PI/2,k,-1);E(ch,t,[[0,'surprised']],i+2);}});
    planes(t,GD,i=>{const h=HOOK.findIndex(o=>o.c===i);if(h<0)return {};const k=t-HOOK[h].tc;return k>0&&k<0.5?{flap:0.25,squint:0.5,brow:0.3,look:[-0.6,0.2]}:{look:[-0.6,0.1]};});}
  // s2–s3: Jets tiến vào phần sân Chiefs nhiều lần (minh hoạ) → dừng ở vạch 5 → đá field goal
  if(IN('s2',t)){const t0=SH.s2[0];if(t<SH.s2b[0]){locoLock(RB,lib,t,(tt)=>[18+(tt-t0)*6.0,0.5*Math.sin(tt*2)],{t0,face:Math.PI/2,gait:'MX_Running'});E(RB,t,[[0,'determined']],4);show(RB);bball(B(RB,'hand_r').getWorldPosition(V()));}
    else{const u=U('s2b',t);idle(RB,GL-4.6,0,Math.PI/2,t,4);holdBall(RB,t);bball(holdBall(RB,t));E(RB,t,[[0,'surprised'],[SH.s2b[0]+0.7,'sad']],4,{look:[0.6,0]});show(RB);}}
  if(IN('s3',t)){fgShot(t,SH.s3[0]+0.2);offense(t,KX+0.5);}
  // s4: Geno nhìn máy quay; s4b: 11 máy bay sà xuống đậu thành đội hình
  if(IN('s4',t)&&t<SH.s4b[0]){bball(qbShot(t));E(QB,t,[[0,'surprised']],1,{look:[0.9,0.1]});offense(t);}
  if(t>=SH.s4b[0]&&t<SH.s5[0]){const u=t-SH.s4b[0];offense(t);bball(qbShot(t));E(QB,t,[[0,'surprised']],1);
    GD.forEach(([x,z],i)=>{const k=cl((u-i*0.1)/0.9);if(k>=1){pAt(PL[i],x,z,t,{look:[-0.6,0.1],browUp:0.5});return;}fly(PL[i],V(x+18,9,z*1.6+(i%2?6:-6)),V(x,0.5*PS,z),sm(k),2,t);});}
  // s5: Jets cúi đầu đi vào biên (thua 35–12)
  if(IN('s5',t)){const t0=SH.s5[0];[QB,...OL.slice(0,3),RB].forEach((ch,i)=>{locoLock(ch,lib,t,(tt)=>[-13-i*1.4-(tt-t0)*0.9,-17-(i%2)*1.1-(tt-t0)*0.9],{t0,face:Math.PI,gait:'Walk_Loop'});rotW(B(ch,'Head'),Lc(ch,1,0,0),0.35);E(ch,t,[[0,'sad']],i+1);show(ch);});}
  // s6: cú đá của kicker (mọi điểm của Jets)
  if(IN('s6',t)){fgShot(t,SH.s6[0]+0.4);}
  // s7: cận máy bay — không tay, không chân, không sổ chiến thuật
  if(IN('s7',t)){planes(t,GD,i=>i===5?{look:[-0.9,0.3],browUp:0.6}:{});}
  // s8: "Except…" máy bay nheo mắt, cất lên; s9: lượn vào end zone
  if(IN('s8',t)){const u=U('s8',t);planes(t,GD,i=>i===5?{skip:true}:{});const k=sm((u-1.2)/1.6);pAt(PL[5],GD[5][0],GD[5][1],t,{y:k*1.6,squint:0.45,brow:-0.3,look:[-0.8,0.2],flap:0.05+k*0.15,pitch:k*0.2});}
  if(IN('s9',t)){const u=U('s9',t);const k=cl(u/1.2);fly(PL[5],V(GL-3,3.2,-3),V(GL+4,0.5*PS,0),sm(k),0.8,t,{bank:0.2*(1-k)});}
  // s10: toàn cảnh mái nhà; s10b: tháp nước + bảng điểm
  if(IN('s10',t)){offense(t);bball(qbShot(t));planes(t);}
  // s11: Geno lùi về ném; s12: một máy bay lao vào — "sacked", ngã mềm
  if(IN('s11',t)){const t0=SH.s11[0];offense(t);planes(t);locoLock(QB,lib,t,(tt)=>[QX-Math.min(3,(tt-t0)*2),0],{t0,back:true,face:Math.PI/2});bball(holdBall(QB,t));E(QB,t,[[0,'determined']],1);show(QB);}
  if(IN('s12',t)){const u=U('s12',t);offense(t);const hit=0.45;const qx=QX-3;planes(t,GD,i=>i===4?{skip:true}:{});
    if(u<hit){idle(QB,qx,0,Math.PI/2,t,1);bball(holdBall(QB,t));E(QB,t,[[0,'determined'],[SH.s12[0]+0.2,'surprised']],1);show(QB);fly(PL[4],V(qx+9,3,-4),V(qx+0.4,1.3,0),u/hit,0.4,t,{squint:0.5,brow:0.4});}
    else{const k=sm((u-hit)/0.5);softFall(QB,qx-k*0.6,0,Math.PI/2,k,-1);E(QB,t,[[0,'surprised']],1);const q=cl((u-hit)/0.8);bball(arc(V(qx,1.4,0.2),V(qx-2,0.15,1.2),q,1),u*9);
      const kb=cl((u-hit)/0.7);pAt(PL[4],qx+0.8+kb*1.5,0.4+kb*0.8,t,{y:Math.sin(Math.PI*kb)*0.8,look:[-0.3,0.4],browUp:0.8},-Math.PI/2+kb*0.6);}}
  // s13 & s15: Jets tới vạch 5 / vạch 8 rồi khựng; s14 & s16: field goal
  const redZone=(t,t0,stopX)=>{const k=Math.max(0,t-t0);locoLock(RB,lib,t,(tt)=>[Math.min(stopX,stopX-6+(tt-t0)*6),0.3],{t0,face:Math.PI/2,gait:'MX_Running'});show(RB);bball(B(RB,'hand_r').getWorldPosition(V()));E(RB,t,[[0,'determined'],[t0+1.1,'surprised']],4);
    planes(t,GLD,i=>({look:[-0.6,0.1]}));OL.slice(0,3).forEach((ch,i)=>{idle(ch,stopX-2.5,-1.5+i*1.5,Math.PI/2,t,i);show(ch);});};
  if(IN('s13',t))redZone(t,SH.s13[0],GL-5*YD);
  if(IN('s15',t))redZone(t,SH.s15[0]-0.4,GL-8*YD);
  if(IN('s14',t))fgShot(t,SH.s14[0]-0.5);
  if(IN('s16',t)){fgShot(t,SH.s16[0]-0.3);offense(t,KX+0.5);}
  // s17–s18: một máy bay lượn 60 yard → touchdown
  if(IN('s17',t)||IN('s18',t)){const k=cl((t-SH.s17[0])/(SH.s18[0]+0.3-SH.s17[0]));fly(PL[7],V(GL-55,3.5,2),V(GL+4,0.5*PS,0),k,1.5,t,{look:[0.6,0],squint:0.2});if(IN('s18',t))planes(t,GLD.slice(0,6),i=>i===0?{skip:true}:{flap:0.2,look:[0,0.3]});}
  // s19–s19b: lán bình luận
  if(IN('s19',t)){const a=t<SH.s19b[0];CM.forEach((ch,i)=>{const talk=(i===0)===a;sitC(ch,WGX+(i?0.8:-0.8),0,WGZ+0.1,0,t,talk?'Sitting_Talking_Loop':'Sitting_Idle_Loop',0.45,i*1.7);rotW(B(ch,'Head'),Lc(ch,0,1,0),(i?-1:1)*0.25);
    E(ch,t,talk?[[0,'talk']]:[[0,i?'smug':'neutral']],i+5,{look:[(i?-0.5:0.5),0.1]});show(ch);});}
  // s20–s20b: Walker & Kelce gấp thêm máy bay trên ghế băng
  if(IN('s20',t)){[[KE,-0.55],[WK,0.55]].forEach(([ch,dx],i)=>{sitC(ch,BX+dx,0,BZ,0,t,'Sitting_Idle_Loop',0.45,i*1.3);ch.root.updateMatrixWorld(true);
      const c=B(ch,'spine_03').getWorldPosition(V()).add(Lc(ch,0,-0.22,0.38)).add(V(0,Math.sin(t*3+i)*0.03,0));handsTo(ch,c);const m=MINI[i];m.root.position.copy(c).add(V(0,0.02,0.05));m.root.rotation.set(0,Math.sin(t*2+i)*0.4,0);m.update(t,{flap:0.1});m.root.visible=true;
      E(ch,t,[[0,'smug'],[SH.s20b[0]+0.3,'laugh']],i+7,{look:[i?-0.4:0.4,-0.3]});show(ch);});}
  // s21: bảng điểm Q4; s22: Jets ở vạch 1, máy bay nằm trên vạch đích; s23: lao vào; s23b: vấp máy bay, bóng dừng trước vạch
  if(IN('s22',t)||IN('s23',t)){const tt0=SH.s23[0]+0.3;planes(t,GLD,i=>i===5?{skip:true}:{look:[-0.6,0.1]});pAt(PL[5],GL+0.3,0,t,{look:[-0.9,0.1],browUp:0.4});
    OL.forEach((ch,i)=>{if(t<tt0){idle(ch,GL-1.8,-2.4+i*1.2,Math.PI/2,t,i,{crouch:0.75});}else{const k=sm((t-tt0)/0.6);idle(ch,GL-1.8+k*0.8,-2.4+i*1.2,Math.PI/2,t,i,{crouch:0.5});}show(ch);});
    if(t<tt0){idle(RB,GL-5,0.4,Math.PI/2,t,4,{crouch:0.3});show(RB);E(RB,t,[[0,'determined']],4);bball(V(GL-0.9,0.35,0));}
    else{const fall0=SH.s23b[0]+0.25;if(t<fall0){locoLock(RB,lib,t,(tt)=>[Math.min(GL-0.9,GL-5+(tt-tt0)*3.2),0.4*(1-cl((tt-tt0)/1.2))],{t0:tt0,face:Math.PI/2,gait:'MX_Running'});show(RB);E(RB,t,[[0,'determined']],4);bball(B(RB,'hand_r').getWorldPosition(V()));}
      else{const k=sm((t-fall0)/0.5);softFall(RB,GL-0.9,0,Math.PI/2,k,1);E(RB,t,[[0,'surprised'],[fall0+1.2,'sad']],4);bball(V(GL-0.35,0.2,0.3),0);}}}
  // s24: Final 14–12 — máy bay nhảy ăn mừng; s25: máy bay cúi chào
  if(IN('s24',t)){planes(t,GLD,i=>({y:Math.abs(Math.sin(t*5+i))*0.5,flap:0.25,bank:Math.sin(t*4+i)*0.3,look:[-0.2,0.4],browUp:0.6}));}
  if(IN('s25',t)){planes(t,GLD,i=>({pitch:-0.25*sm(K('s25',t)*3)*Math.abs(Math.sin(t*2+i*0.3)),look:[-0.6,-0.2]}));}
  // s26: BIẾN HÌNH — Jets đứng sững rồi gập lại thành máy bay giấy xanh trắng
  if(IN('s26',t)){const u=U('s26',t);const sq=[QB,...OL];sq.forEach((ch,i)=>{const z=-1.8+Math.floor(i/2)*1.8,tx=TFX+(i%2)*1.5;const k=sm((u-0.9-i*0.08)/0.7);
      if(k<1){idle(ch,tx,z,-Math.PI/2,t,i);E(ch,t,[[0,'surprised'],[SH.s26[0]+0.6,'shock']],i+1);ch.root.scale.setScalar(ch.root.userData.sc*(1-k));ch.root.rotation.y+=k*6;ch.root.updateMatrixWorld(true);show(ch);}
      if(k>0)pAt(JPL[i],tx,z,t,{y:0,look:[0.6,0.2],browUp:0.5},Math.PI/2).root.scale.setScalar(PS*Math.max(0.01,k));});
    const kc=cl((u-0.9)/1.4);if(kc>0&&kc<1){conf.visible=true;const m=new THREE.Matrix4(),q=new THREE.Quaternion();for(let i=0;i<CONF;i++){const a=i*2.39,rr=0.4+(i%7)*0.25;q.setFromEuler(new THREE.Euler(t*6+i,t*4+i*2,0));m.compose(V(TFX+0.7+Math.cos(a)*rr*kc*2,0.3+((i*13)%10)*0.2+kc*1.5-kc*kc*2.5,-1.8+((i*7)%3)*1.8+Math.sin(a)*rr*kc),q,V(1,1,1));conf.setMatrixAt(i,m);}conf.instanceMatrix.needsUpdate=true;}}
  // s27: các máy bay Jets cất cánh… và đáp xuống vạch 1 yard; s28: cận cảnh "Field goal."
  if(IN('s27',t)){JPL.forEach((p,i)=>{const z=-4+i*1.6;const k=cl((t-SH.s27[0]-i*0.07)/2.6);fly(p,V(TFX+(i%2)*1.5,0.5*PS,-1.8+Math.floor(i/2)*1.8),V(GL-0.9,0.5*PS,z*0.6),sm(k),5,t,{look:[0.8,0.3],browUp:0.6});if(k>=1)pAt(p,GL-0.9,z*0.6,t,{look:[0.6,-0.3]},Math.PI/2);});}
  if(IN('s28',t)){JPL.forEach((p,i)=>pAt(p,GL-0.9,(-4+i*1.6)*0.6,t,{look:[-0.2,-0.4],squint:0.35,brow:0.4,flap:0.01},Math.PI/2));}
  // s29: Chiefs ký 11 máy bay; s30: bảng "40 PLAYS"
  if(IN('s29',t)||IN('s30',t)){const pos=[...Array(11)].map((_,i)=>[WBX-6+(i%6)*2.4,WBZ+3.2+Math.floor(i/6)*2.6]);planes(t,pos,i=>({look:[0,0.3],browUp:0.5,flap:0.06}),);PL.forEach(p=>p.root.rotation.y=Math.PI*0.95);
    idle(KE,WBX+1.9,WBZ+1.4,-0.5,t,7);idle(WK,WBX-1.9,WBZ+1.4,0.5,t,8);if(IN('s29',t)){thumbs(KE,sm(U('s29',t)*2));thumbs(WK,sm(U('s29',t)*2-0.5));}else{aim(B(KE,'upperarm_r'),B(KE,'lowerarm_r'),Lc(KE,-0.6,0.4,0.5));aim(B(KE,'lowerarm_r'),B(KE,'hand_r'),Lc(KE,-0.5,0.5,0.6));}
    KE.root.updateMatrixWorld(true);WK.root.updateMatrixWorld(true);E(KE,t,[[0,'laugh']],7,{look:[0.3,0.1]});E(WK,t,[[0,'smug']],8,{look:[-0.3,0.1]});show(KE,WK);}
  const dm=location.hash.match(/dbg=([-\d.,]+)/);if(dm){const v=dm[1].split(',').map(Number);cam.position.set(v[0],v[1],v[2]);cam.lookAt(v[3],v[4],v[5]);cam.fov=50;cam.updateProjectionMatrix();}
};
let comp;if(MB){comp=new EffectComposer(r,{frameBufferType:THREE.HalfFloatType,multisampling:2});comp.addPass(new RenderPass(s,cam));
 const vp=new VelocityDepthNormalPass(s,cam);comp.addPass(vp);comp.addPass(new EffectPass(cam,new MotionBlurEffect(vp,{intensity:0.5,jitter:0,samples:8}),new ToneMappingEffect({mode:ToneMappingMode.NEUTRAL})));}
window.CUTS=CUTS;
window.renderFrame=t=>{if(!MB){pose(t);r.render(s,cam);return;}
  const dt=1/30;let c0=0;for(const c of CUTS)if(c<=t+1e-6)c0=c;const tp=Math.max(c0,t-dt);if(!(window._lt!=null&&Math.abs(window._lt-tp)<1e-4&&tp>c0-1e-6&&tp!==t)){pose(tp);comp.render(dt);}pose(t);comp.render(dt);window._lt=t;};
window.ready=true;
</script></body></html>
