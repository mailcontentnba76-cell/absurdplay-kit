<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#000"><canvas id="c"></canvas>
<style>@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2)}@font-face{font-family:Inter;font-weight:900;src:url(fonts/inter-latin-900-normal.woff2)}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {buildBayou,bayouLights,makePelican,BC} from './lib/bayou.js';
import {loadLibrary} from './lib/nhanvat2.js';import {MURRAY,FEARS,QUEEN,JONES,BEY} from './lib/cast11.js';import {clipPose,expr} from './lib/dongtac.js';import {place} from './lib/bongro_mx.js';import {basketball} from './lib/nba.js';
await Promise.all(['100px Anton','900 60px Inter'].map(f=>document.fonts.load(f)));
const W=innerWidth,H=innerHeight;const r=new THREE.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});r.setSize(W,H,false);r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFShadowMap;r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.NeutralToneMapping;
const s=new THREE.Scene();const B=buildBayou(s);bayouLights(s,B.sunDir);
const PEL=[0,1,2,3,4].map(i=>{const p=makePelican({seed:i+1,jersey:i===0?{color:'#0C2340',text:'BIRDS',textColor:'#B4975A'}:null});p.root.position.set(3+i*1.3,0,-1+ (i%2)*0.8);p.root.rotation.y=-Math.PI/2;s.add(p.root);return p;});
const lib=await loadLibrary();const PL=[MURRAY(lib),FEARS(lib),QUEEN(lib),JONES(lib),BEY(lib)];PL.forEach((ch,i)=>{s.add(ch.root);ch.root.traverse(o=>{if(o.isMesh)o.castShadow=true});clipPose(ch,lib,[{name:'Idle_Loop',time:i*0.3,w:1}]);place(ch,-1-i*1.1,(i%2)*0.8-0.4,Math.PI/2,0);});
const ball=basketball();s.add(ball);
const cam=new THREE.PerspectiveCamera(50,W/H,0.1,2000);const fl=new THREE.DirectionalLight('#fff',0.6);cam.add(fl);s.add(cam);
window.renderFrame=t=>{const v=location.hash;B.update(t,cam);
  PEL.forEach((p,i)=>p.update(t,{pouch:v==='#pouch'&&i===0?0.9:0,bulge:v==='#pouch'&&i===1?1:0,flap:v==='#fly'?1:0,fly:v==='#fly'?1:0,walking:v==='#walk',walk:t*0.8}));
  if(v==='#fly'){PEL.forEach((p,i)=>p.root.position.y=2.5+i*0.3);}
  PL.forEach((ch,i)=>expr(ch,t,[[0,['neutral','shock','smug','determined','panic'][i]]]));
  ball.position.copy(PEL[1].mouth.getWorldPosition(new THREE.Vector3()));
  if(v==='#wide'){cam.position.set(-4,9,24);cam.lookAt(2,1,0);cam.fov=55;}
  else if(v==='#pel'||v==='#pouch'){cam.position.set(1.0,1.5,2.4);cam.lookAt(4,1.3,-0.5);cam.fov=40;}
  else if(v==='#fly'){cam.position.set(4,1.2,6);cam.lookAt(5,3,0);cam.fov=55;}
  else if(v==='#pl'){cam.position.set(-3.3,1.9,4.6);cam.lookAt(-3.3,1.6,0);cam.fov=48;}
  else if(v==='#low'){cam.position.set(-20,1.2,12);cam.lookAt(0,2.5,0);cam.fov=60;}
  else {cam.position.set(8,3,12);cam.lookAt(0,1.5,0);cam.fov=55;}
  cam.updateProjectionMatrix();r.render(s,cam);};
window.ready=true;
</script></body></html>
