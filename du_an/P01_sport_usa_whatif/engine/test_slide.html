 if(prev&&prev.k===k&&f.y<0.05){s+=Math.abs(f.x-prev.x);n++;}prev={k,x:f.x};}console.log('v',v,'avg planted-foot slip/frame m',(s/n).toFixed(3),'body/frame',(v/30).toFixed(3));}
