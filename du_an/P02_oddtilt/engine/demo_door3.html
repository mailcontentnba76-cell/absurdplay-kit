function leatherShape(t,len,flap,slide){ // len: phần đã trải (0..1), flap: gió hất (0..1), slide: kéo gom sang phải (0..1)
  const p=LG.attributes.position.array;

 [2.8,5.7,V(.12,1.3,-1.15),V(.08,1.3,-1.05),V(.0,1.45,1.6),V(0,1.45,1.6),50],
 [5.7,8.35,V(-.75,1.2,-.85),V(-.73,1.2,-.8),V(.12,1.12,1.6),V(.12,1.12,1.6),50],
 [8.35,11.1,V(0,1.15,-1.6),V(0,1.15,-1.57),V(0,1.12,1.6),V(0,1.12,1.6),48]];

      const tw=E(t,4.75,5.15)*-1.05;rotWorld(A.bones['neck01____head'],UP,tw*0.45);rotWorld(A.bones['head____head'],UP,tw*0.55);rotWorld(A.bones['spine01____head'],UP,tw*0.15);}
  }

    applyMocap(F,MO['77_02'],2+t,{pos:V(-.62,0,3.15),yaw:Math.PI+0.15,faceAt:2,inPlace:true});
